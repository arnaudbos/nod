<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nod — Kanban</title>
  <style>
    :root {
      --color-todo: #9b9a97;
      --color-in-progress: #d97706;
      --color-backlog: #6366f1;
      --color-done: #0f7b6c;
      --color-cancelled: #9b9a97;

      --color-epic: #cf9006;
      --color-task: #0a85d1;
      --color-subtask: #9065b0;
      --color-bug: #e03e3e;

      --color-critical: #e03e3e;
      --color-high: #d97706;
      --color-medium: #ca8a04;
      --color-low: #9b9a97;

      --bg: #ffffff;
      --col-bg: #f7f7f5;
      --card-bg: #ffffff;
      --card-hover-bg: #f7f7f5;
      --border: #e9e9e7;
      --text: #37352f;
      --text-muted: #9b9a97;
      --text-secondary: #6b6b6b;
      --radius: 6px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .project-path {
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    .last-updated {
      font-size: 11px;
      color: var(--text-muted);
    }

    .seed-btn {
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg);
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.1s, border-color 0.1s;
    }

    .seed-btn:hover { background: var(--col-bg); border-color: #ccc; }
    .seed-btn:disabled { opacity: 0.5; cursor: default; }

    .board-wrapper {
      flex: 1;
      overflow-x: auto;
      padding: 24px 20px;
    }

    .board {
      display: flex;
      gap: 12px;
      height: 100%;
      min-width: max-content;
    }

    .column {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .column-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      margin-bottom: 2px;
    }

    .col-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .col-backlog .col-dot    { background: var(--color-backlog); }
    .col-todo .col-dot       { background: var(--color-todo); }
    .col-in-progress .col-dot { background: var(--color-in-progress); }
    .col-done .col-dot       { background: var(--color-done); }
    .col-cancelled .col-dot  { background: var(--color-cancelled); }

    .col-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      flex: 1;
    }

    .col-count {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--col-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 7px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--col-bg);
      border-radius: 8px;
      padding: 8px;
      min-height: 60px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.1s ease, box-shadow 0.15s ease;
      position: relative;
    }

    .card:hover {
      background: var(--card-hover-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .card[data-priority="critical"] { border-left: 3px solid var(--color-critical); }
    .card[data-priority="high"]     { border-left: 3px solid var(--color-high); }
    .card[data-priority="medium"]   { border-left: 3px solid var(--color-medium); }
    .card[data-priority="low"]      { border-left: 3px solid var(--border); }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      gap: 6px;
    }

    .card-badges {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .badge-epic    { background: #fef3c7; color: #92400e; }
    .badge-task    { background: #dbeafe; color: #1e40af; }
    .badge-subtask { background: #ede9fe; color: #5b21b6; }
    .badge-bug     { background: #fee2e2; color: #991b1b; }

    .badge-critical { background: #fee2e2; color: #991b1b; }
    .badge-high     { background: #ffedd5; color: #9a3412; }
    .badge-medium   { background: #fef9c3; color: #713f12; }
    .badge-low      { background: #f3f4f6; color: #6b7280; }

    .card-id {
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 8px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .parent-ref {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .parent-arrow { font-size: 9px; opacity: 0.6; }

    .tag {
      font-size: 10px;
      padding: 1px 6px;
      background: var(--col-bg);
      color: var(--text-secondary);
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* Arrow button that opens the detail panel (cards and group headers). */
    .open-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      background: none;
      color: var(--text-muted);
      font: inherit;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.1s, border-color 0.1s, color 0.1s;
    }

    .open-btn:hover,
    .open-btn:focus-visible {
      background: #ebebe8;
      border-color: var(--border);
      color: var(--text);
    }

    .card .open-btn {
      position: absolute;
      right: 6px;
      bottom: 6px;
    }

    .group-header .open-btn {
      align-self: center;
      width: 18px;
      height: 18px;
      margin: -3px 0;
      font-size: 11px;
    }

    .epic-header .open-btn { color: #a39568; }
    .task-header .open-btn { color: #7f9ab5; }

    .card:hover .open-btn,
    .card.is-selected .open-btn,
    .group-header:hover .open-btn,
    .group-header.is-selected .open-btn,
    .open-btn:focus-visible { opacity: 1; }

    /* ── Selection: highlight the selected task's descendants, dim the rest ── */

    :root { --color-select: #2383e2; }

    .board.has-selection .card,
    .board.has-selection .group-header {
      opacity: 0.3;
      transition: opacity 0.15s ease, background 0.1s, box-shadow 0.15s ease;
    }

    .board.has-selection .card.is-selected,
    .board.has-selection .card.is-related,
    .board.has-selection .group-header.is-selected,
    .board.has-selection .group-header.is-related { opacity: 1; }

    .card.is-selected          { box-shadow: 0 0 0 2px var(--color-select), 0 2px 8px rgba(0,0,0,0.1); }
    .card.is-related           { box-shadow: 0 0 0 1px rgba(35, 131, 226, 0.5); }
    .group-header.is-selected  { box-shadow: inset 0 0 0 2px var(--color-select); }
    .group-header.is-related   { box-shadow: inset 0 0 0 1px rgba(35, 131, 226, 0.5); }

    /* ── Priority bands, epic panels, task groups ───── */

    .band {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .band + .band { margin-top: 8px; }

    .band-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 2px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }

    .band-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
    }

    .band-critical .band-dot { background: var(--color-critical); }
    .band-high .band-dot     { background: var(--color-high); }
    .band-medium .band-dot   { background: var(--color-medium); }
    .band-low .band-dot      { background: var(--color-low); }

    .band-count { font-weight: 500; opacity: 0.8; }

    /* An ancestor (epic, or the parent task of subtasks) is context for the cards
       under it, so it's a quiet header line with a thin rule down its cards, not
       a box around them. Headers stack: epic, then task, then the card. */
    .epic-group,
    .task-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 7px;
      border-left: 2px solid;
    }

    .epic-group { border-left-color: #e8d9a4; }
    .task-group { border-left-color: #cfe2f3; }

    .group-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .epic-header { color: #7c6a3c; }
    .task-header { color: #4d6d8c; }

    /* Task headers sit one level deeper, so there's less room: if the status chip
       doesn't fit beside the title, it wraps below instead of squeezing the title. */
    .task-header { flex-wrap: wrap; row-gap: 2px; }
    .task-header .group-title { flex: 1 1 110px; }
    .epic-header:hover { background: rgba(207, 144, 6, 0.1); }
    .task-header:hover { background: rgba(10, 133, 209, 0.08); }

    .group-id {
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 10px;
      flex-shrink: 0;
    }

    .epic-header .group-id { color: #b0a278; }
    .task-header .group-id { color: #8fa9c4; }

    .group-title {
      flex: 1;
      min-width: 0;
      font-weight: 500;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .group-status {
      flex-shrink: 0;
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid;
    }

    .epic-header .group-status { color: #a39568; border-color: #efe5c2; }
    .task-header .group-status { color: #7f9ab5; border-color: #dbe8f4; }

    .empty-col {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 20px 16px;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      font-size: 14px;
      color: var(--text-muted);
    }

    .error-banner {
      background: #fff5f5;
      color: #c53030;
      padding: 10px 20px;
      font-size: 13px;
      border-bottom: 1px solid #fed7d7;
    }

    /* ── Detail Panel ─────────────────────────────── */

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 15, 15, 0.25);
      z-index: 100;
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #overlay.open { display: block; opacity: 1; }

    /* A third of the screen, but never narrower than 440px. Dragging the handle
       overrides this with a fixed width (see "Panel resize" in the script). */
    :root { --panel-width: max(440px, 33.333vw); }

    #detail-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--panel-width);
      height: 100vh;
      background: #fff;
      z-index: 101;
      transform: translateX(100%);
      transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 30px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }

    #detail-panel.open { transform: translateX(0); }

    /* Drag handle on the panel's left edge. A sibling of the panel rather than a
       child, so it doesn't scroll away with the panel's content. */
    #panel-resizer {
      position: fixed;
      top: 0;
      bottom: 0;
      right: calc(var(--panel-width) - 3px);
      width: 6px;
      z-index: 102;
      cursor: col-resize;
      touch-action: none;
      display: none;
    }

    #panel-resizer.open { display: block; }

    #panel-resizer::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 2px;
      width: 2px;
      background: var(--color-select);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    #panel-resizer:hover::after,
    #panel-resizer.dragging::after { opacity: 0.6; }

    body.resizing { cursor: col-resize; user-select: none; }

    .panel-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 1;
    }

    .panel-task-id {
      font-family: 'Menlo', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .panel-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background 0.1s, color 0.1s;
    }

    .panel-close:hover { background: var(--col-bg); color: var(--text); }

    .panel-content {
      padding: 28px 28px 40px;
      flex: 1;
    }

    .panel-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 22px;
      letter-spacing: -0.3px;
    }

    .panel-props {
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .prop-row {
      display: flex;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      min-height: 38px;
    }

    .prop-row:last-child { border-bottom: none; }

    .prop-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      width: 80px;
      flex-shrink: 0;
    }

    .prop-value {
      font-size: 13px;
      color: var(--text);
      flex: 1;
    }

    .prop-select {
      font-size: 12px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-family: var(--font);
    }

    .prop-select:hover { border-color: #aaa; }
    .prop-select:focus { outline: none; border-color: #888; }

    .prop-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .prop-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .prop-tag {
      font-size: 11px;
      padding: 2px 7px;
      background: var(--col-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-secondary);
    }

    .panel-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }

    .panel-body-text {
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 12px;
      line-height: 1.75;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--col-bg);
      border-radius: 6px;
      padding: 14px 16px;
      border: 1px solid var(--border);
    }

    .task-link {
      color: var(--color-select);
      text-decoration: none;
      border-radius: 3px;
      white-space: nowrap; /* don't break an id at its hyphen */
      cursor: pointer;
    }

    .task-link:hover {
      text-decoration: underline;
      background: rgba(35, 131, 226, 0.08);
    }

    .prop-related {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 10px;
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 12px;
    }

    .panel-loading {
      font-size: 13px;
      color: var(--text-muted);
      padding: 40px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      nod
    </div>
    <div class="header-right">
      <span class="project-path" id="project-path">—</span>
      <span class="last-updated" id="last-updated">loading…</span>
      <button class="seed-btn" id="seed-btn" title="Populate board with demo tasks">Seed demo data</button>
    </div>
  </header>

  <div id="error-container"></div>

  <div class="board-wrapper" id="board-wrapper">
    <div class="loading">Loading tasks…</div>
  </div>

  <div id="overlay"></div>
  <div id="panel-resizer" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
  <div id="detail-panel">
    <div class="panel-toolbar">
      <span class="panel-task-id" id="panel-task-id">—</span>
      <button class="panel-close" id="panel-close" title="Close (Esc)">✕</button>
    </div>
    <div class="panel-content" id="panel-content">
      <div class="panel-loading">Loading…</div>
    </div>
  </div>

  <script>
    const COLUMNS = [
      { key: 'backlog',     label: 'Backlog',      cls: 'col-backlog' },
      { key: 'todo',        label: 'Todo',         cls: 'col-todo' },
      { key: 'in-progress', label: 'In Progress',  cls: 'col-in-progress' },
      { key: 'done',        label: 'Done',         cls: 'col-done' },
      { key: 'cancelled',   label: 'Cancelled',    cls: 'col-cancelled' },
    ];

    const STATUSES = ['todo', 'in-progress', 'backlog', 'done', 'cancelled'];
    const PRIORITIES = ['critical', 'high', 'medium', 'low'];

    const STATUS_LABELS = {
      'todo': 'Todo', 'in-progress': 'In Progress',
      'backlog': 'Backlog', 'done': 'Done', 'cancelled': 'Cancelled',
    };
    const PRIORITY_LABELS = {
      'critical': 'Critical', 'high': 'High', 'medium': 'Medium', 'low': 'Low',
    };

    let allTasks = [];
    let activePanelId = null;
    let selectedId = null; // card whose descendants are highlighted on the board

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Board ──────────────────────────────────────

    function renderCard(task, hideParent = false) {
      const tags = (task.tags ?? []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
      const parent = task.parent && !hideParent
        ?`<span class="parent-ref"><span class="parent-arrow">↑</span>${esc(task.parent)}</span>`
        : '';

      return `
        <div class="card" data-id="${esc(task.id)}" data-priority="${esc(task.priority)}">
          <div class="card-top">
            <div class="card-badges">
              <span class="badge badge-${esc(task.type)}">${esc(task.type)}</span>
              <span class="badge badge-${esc(task.priority)}">${esc(task.priority)}</span>
            </div>
            <span class="card-id">${esc(task.id)}</span>
          </div>
          <div class="card-title">${esc(task.title)}</div>
          <div class="card-footer">${parent}${tags}</div>
          <button class="open-btn" type="button" title="Open details" aria-label="Open details">→</button>
        </div>
      `;
    }

    // The ancestors a card is shown under, outermost first: its epic (if it has
    // one) and the tasks between that epic and the card. Empty if the parents
    // form a cycle, so those cards are shown flat rather than lost.
    function headerChain(task, byId) {
      const chain = [];
      const visited = new Set([task.id]);
      let current = task;
      while (current.parent) {
        const parent = byId[current.parent];
        if (!parent) break; // dangling parent: nothing to show a header for
        if (visited.has(parent.id)) return [];
        visited.add(parent.id);
        chain.unshift(parent);
        if (parent.type === 'epic') break;
        current = parent;
      }
      return chain;
    }

    function renderGroupHeader(task, colKey) {
      const kind = task.type === 'epic' ? 'epic' : 'task';
      const status = task.status !== colKey
        ? `<span class="group-status">${esc(STATUS_LABELS[task.status] ?? task.status)}</span>`
        : '';
      return `
        <div class="group-header ${kind}-header" data-id="${esc(task.id)}" title="${esc(task.id + ' — ' + task.title)}">
          <span class="group-id">${esc(task.id)}</span>
          <span class="group-title">${esc(task.title)}</span>${status}
          <button class="open-btn" type="button" title="Open details" aria-label="Open details">→</button>
        </div>
      `;
    }

    // Cards of one column sharing a priority. Each card is stacked under the
    // headers of its ancestors (epic, then parent task). A task that has cards
    // under it in this band is shown as their header instead of as a card.
    function renderBand(band, colKey, byId) {
      const chains = new Map();
      const asHeader = new Set();
      for (const t of band.tasks) {
        const chain = headerChain(t, byId);
        chains.set(t.id, chain);
        for (const ancestor of chain) asHeader.add(ancestor.id);
      }

      // A group sits where its first card would have been.
      const root = { items: [] };
      for (const t of band.tasks) {
        if (asHeader.has(t.id)) continue;
        let node = root;
        for (const ancestor of chains.get(t.id)) {
          let child = node.items.find(item => item.header?.id === ancestor.id);
          if (!child) { child = { header: ancestor, items: [] }; node.items.push(child); }
          node = child;
        }
        node.items.push({ card: t });
      }

      function renderItems(node) {
        return node.items.map(item => {
          if (item.card) return renderCard(item.card, !!node.header && item.card.parent === node.header.id);
          const kind = item.header.type === 'epic' ? 'epic' : 'task';
          return `
            <div class="${kind}-group">
              ${renderGroupHeader(item.header, colKey)}
              ${renderItems(item)}
            </div>
          `;
        }).join('');
      }

      return `
        <div class="band">
          <div class="band-header band-${esc(band.priority)}">
            <span class="band-dot"></span>
            <span class="band-label">${esc(PRIORITY_LABELS[band.priority] ?? band.priority)}</span>
            <span class="band-count">${band.tasks.length}</span>
          </div>
          ${renderItems(root)}
        </div>
      `;
    }

    function renderColumnCards(colTasks, colKey, byId) {
      const bands = [];
      for (const t of colTasks) {
        const last = bands[bands.length - 1];
        if (last && last.priority === t.priority) last.tasks.push(t);
        else bands.push({ priority: t.priority, tasks: [t] });
      }
      return bands.map(band => renderBand(band, colKey, byId)).join('');
    }

    function renderBoard(tasks) {
      const byId = {};
      for (const t of tasks) byId[t.id] = t;
      const byStatus = {};
      for (const col of COLUMNS) byStatus[col.key] = [];
      for (const t of tasks) {
        if (byStatus[t.status]) byStatus[t.status].push(t);
      }

      // Order each column like the CLI: priority first, then creation date.
      const PRIORITY_RANK = { critical: 0, high: 1, medium: 2, low: 3 };
      for (const col of COLUMNS) {
        byStatus[col.key].sort((a, b) =>
          (PRIORITY_RANK[a.priority] ?? 99) - (PRIORITY_RANK[b.priority] ?? 99) ||
          String(a.created ?? '').localeCompare(String(b.created ?? '')));
      }

      const boardHtml = COLUMNS.map(col => {
        const colTasks = byStatus[col.key] ?? [];
        const cards = colTasks.length
          ? renderColumnCards(colTasks, col.key, byId)
          : `<div class="empty-col">No tasks</div>`;

        return `
          <div class="column ${esc(col.cls)}">
            <div class="column-header">
              <div class="col-dot"></div>
              <span class="col-title">${esc(col.label)}</span>
              <span class="col-count">${colTasks.length}</span>
            </div>
            <div class="cards">${cards}</div>
          </div>
        `;
      }).join('');

      document.getElementById('board-wrapper').innerHTML = `<div class="board">${boardHtml}</div>`;
      applyHighlight();
    }

    // ── Selection ──────────────────────────────────

    // Every task below `rootId`, at any depth (epic → tasks → subtasks).
    function descendantIds(rootId) {
      const childrenOf = {};
      for (const t of allTasks) {
        if (t.parent) (childrenOf[t.parent] = childrenOf[t.parent] ?? []).push(t.id);
      }
      const found = new Set();
      const stack = [rootId];
      while (stack.length) {
        for (const id of childrenOf[stack.pop()] ?? []) {
          if (id === rootId || found.has(id)) continue; // guards against parent cycles
          found.add(id);
          stack.push(id);
        }
      }
      return found;
    }

    // Marks the DOM in place, so the 3s refresh can re-apply it after a re-render.
    // The same task can appear twice (as an epic panel header and as a card).
    function applyHighlight() {
      const board = document.querySelector('.board');
      if (!board) return;
      if (selectedId && !allTasks.some(t => t.id === selectedId)) selectedId = null;
      const related = selectedId ? descendantIds(selectedId) : new Set();
      board.classList.toggle('has-selection', selectedId !== null);
      board.querySelectorAll('.card, .group-header').forEach(el => {
        el.classList.toggle('is-selected', el.dataset.id === selectedId);
        el.classList.toggle('is-related', related.has(el.dataset.id));
      });
    }

    // Selecting the selected card again deselects it.
    function selectTask(id) {
      selectedId = id === selectedId ? null : id;
      applyHighlight();
    }

    function clearSelection() {
      selectedId = null;
      applyHighlight();
    }

    // One delegated listener: the board's DOM is rebuilt on every refresh.
    document.getElementById('board-wrapper').addEventListener('click', e => {
      const item = e.target.closest('.card, .group-header');
      if (!item) return clearSelection(); // clicked empty space
      if (e.target.closest('.open-btn')) return openDetail(item.dataset.id);
      selectTask(item.dataset.id);
    });

    async function fetchTasks() {
      try {
        const res = await fetch('/api/tasks');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allTasks = data.tasks ?? [];
        document.getElementById('project-path').textContent = data.root ?? '';
        document.getElementById('last-updated').textContent =
          'Updated ' + new Date().toLocaleTimeString();
        document.getElementById('error-container').innerHTML = '';
        renderBoard(allTasks);
      } catch (err) {
        document.getElementById('error-container').innerHTML =
          `<div class="error-banner">Error fetching tasks: ${esc(err.message)}</div>`;
      }
    }

    async function updateTask(id, field, value) {
      try {
        const res = await fetch('/api/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, field, value }),
        });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error ?? `HTTP ${res.status}`);
        }
        await fetchTasks();
        if (activePanelId === id) await refreshPanel(id);
      } catch (err) {
        document.getElementById('error-container').innerHTML =
          `<div class="error-banner">Error updating: ${esc(err.message)}</div>`;
      }
    }

    // ── Detail Panel ──────────────────────────────

    function openDetail(id) {
      activePanelId = id;
      document.getElementById('overlay').classList.add('open');
      document.getElementById('detail-panel').classList.add('open');
      document.getElementById('panel-resizer').classList.add('open');
      document.getElementById('panel-task-id').textContent = id;
      document.getElementById('panel-content').innerHTML =
        '<div class="panel-loading">Loading…</div>';
      document.getElementById('detail-panel').scrollTop = 0;
      refreshPanel(id);
    }

    function closeDetail() {
      activePanelId = null;
      document.getElementById('overlay').classList.remove('open');
      document.getElementById('detail-panel').classList.remove('open');
      document.getElementById('panel-resizer').classList.remove('open');
    }

    async function refreshPanel(id) {
      try {
        const res = await fetch(`/api/task/${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { task } = await res.json();
        if (activePanelId !== id) return; // the panel moved on while this loaded
        renderPanel(task);
      } catch (err) {
        if (activePanelId !== id) return;
        document.getElementById('panel-content').innerHTML =
          `<div class="error-banner">Error loading task: ${esc(err.message)}</div>`;
      }
    }

    // ── Task links ────────────────────────────────

    // Anything shaped like a task id (epic-1, subtask-6, …). Only ids that match
    // an existing task become links, so lookalikes and deleted tasks stay text.
    const TASK_REF = /(?<![\w-])[a-z]+-\d+(?![\w-])/g;

    function taskLink(id) {
      const target = allTasks.find(t => t.id === id);
      if (!target) return esc(id);
      return `<a class="task-link" href="#${esc(id)}" data-task-link="${esc(id)}" title="${esc(target.title)}">${esc(id)}</a>`;
    }

    // Escapes `text` and turns each mention of another task into a link.
    function withTaskLinks(text, selfId) {
      let out = '';
      let last = 0;
      for (const m of text.matchAll(TASK_REF)) {
        if (m[0] === selfId || !allTasks.some(t => t.id === m[0])) continue;
        out += esc(text.slice(last, m.index)) + taskLink(m[0]);
        last = m.index + m[0].length;
      }
      return out + esc(text.slice(last));
    }

    // Follow a link: select the task on the board and show it in the panel.
    function goToTask(id) {
      selectedId = id;
      applyHighlight();
      document.querySelector('.card.is-selected, .group-header.is-selected')
        ?.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
      openDetail(id);
    }

    document.getElementById('panel-content').addEventListener('click', e => {
      const link = e.target.closest('a[data-task-link]');
      if (!link) return;
      e.preventDefault();
      goToTask(link.dataset.taskLink);
    });

    function renderPanel(task) {
      const tags = (task.tags ?? []).length
        ? `<div class="prop-tags">${task.tags.map(t =>
            `<span class="prop-tag">${esc(t)}</span>`).join('')}</div>`
        : `<span class="prop-value" style="color:var(--text-muted)">—</span>`;

      const statusOptions = STATUSES
        .map(s => `<option value="${s}" ${s === task.status ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`)
        .join('');

      const priorityOptions = PRIORITIES
        .map(p => `<option value="${p}" ${p === task.priority ? 'selected' : ''}>${PRIORITY_LABELS[p]}</option>`)
        .join('');

      const bodyHtml = task.body?.trim()
        ? `<div class="panel-body-text">${withTaskLinks(task.body.trim(), task.id)}</div>`
        : `<div class="panel-body-text" style="color:var(--text-muted);font-style:italic">No description.</div>`;

      document.getElementById('panel-content').innerHTML = `
        <div class="panel-title">${withTaskLinks(task.title, task.id)}</div>
        <div class="panel-props">
          <div class="prop-row">
            <span class="prop-label">Status</span>
            <select class="prop-select" id="prop-status" data-field="status">${statusOptions}</select>
          </div>
          <div class="prop-row">
            <span class="prop-label">Priority</span>
            <select class="prop-select" id="prop-priority" data-field="priority">${priorityOptions}</select>
          </div>
          <div class="prop-row">
            <span class="prop-label">Type</span>
            <span class="prop-value">
              <span class="prop-badge badge-${esc(task.type)}">${esc(task.type)}</span>
            </span>
          </div>
          <div class="prop-row">
            <span class="prop-label">Parent</span>
            <span class="prop-value" style="${!task.parent ? 'color:var(--text-muted)' : ''}">
              ${task.parent
                ? `<span style="font-family:monospace;font-size:12px">${taskLink(task.parent)}</span>`
                : '—'}
            </span>
          </div>
          ${(task.related ?? []).length ? `
          <div class="prop-row">
            <span class="prop-label">Related</span>
            <span class="prop-value prop-related">${task.related.map(taskLink).join('')}</span>
          </div>` : ''}
          <div class="prop-row">
            <span class="prop-label">Tags</span>
            ${tags}
          </div>
          <div class="prop-row">
            <span class="prop-label">Created</span>
            <span class="prop-value">${esc(task.created)}</span>
          </div>
          <div class="prop-row">
            <span class="prop-label">Updated</span>
            <span class="prop-value">${esc(task.updated)}</span>
          </div>
        </div>
        <div class="panel-section-title">Description</div>
        ${bodyHtml}
      `;

      document.getElementById('panel-task-id').textContent = task.id;

      ['prop-status', 'prop-priority'].forEach(elId => {
        const el = document.getElementById(elId);
        el?.addEventListener('change', () => updateTask(task.id, el.dataset.field, el.value));
      });
    }

    document.getElementById('panel-close').addEventListener('click', closeDetail);
    document.getElementById('overlay').addEventListener('click', closeDetail);
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (activePanelId) closeDetail();
      else clearSelection();
    });

    // ── Panel resize ──────────────────────────────
    // By default the panel is a third of the screen (see --panel-width in the CSS).
    // 440px is the minimum, so it can be dragged wider but never narrower than that.

    const PANEL_MIN_WIDTH = 440;
    const PANEL_MARGIN = 40; // always leave a strip of board (and overlay) visible
    const PANEL_WIDTH_KEY = 'nod.panelWidth';
    let panelWidth = null; // px once the user has dragged it; null = the default width

    function setPanelWidth(width) {
      const max = Math.max(PANEL_MIN_WIDTH, window.innerWidth - PANEL_MARGIN);
      panelWidth = Math.round(Math.min(max, Math.max(PANEL_MIN_WIDTH, width)));
      document.documentElement.style.setProperty('--panel-width', panelWidth + 'px');
    }

    try {
      const saved = parseInt(localStorage.getItem(PANEL_WIDTH_KEY), 10);
      if (saved) setPanelWidth(saved);
    } catch { /* storage unavailable: keep the default */ }

    window.addEventListener('resize', () => {
      if (panelWidth !== null) setPanelWidth(panelWidth); // re-clamp to the new viewport
    });

    (function () {
      const handle = document.getElementById('panel-resizer');

      handle.addEventListener('pointerdown', e => {
        e.preventDefault();
        handle.setPointerCapture(e.pointerId);
        handle.classList.add('dragging');
        document.body.classList.add('resizing');
      });

      handle.addEventListener('pointermove', e => {
        if (!handle.hasPointerCapture(e.pointerId)) return;
        setPanelWidth(window.innerWidth - e.clientX);
      });

      const stop = e => {
        if (!handle.hasPointerCapture(e.pointerId)) return;
        handle.releasePointerCapture(e.pointerId);
        handle.classList.remove('dragging');
        document.body.classList.remove('resizing');
        try { localStorage.setItem(PANEL_WIDTH_KEY, String(panelWidth)); } catch { /* ignore */ }
      };
      handle.addEventListener('pointerup', stop);
      handle.addEventListener('pointercancel', stop);
    })();

    document.getElementById('seed-btn').addEventListener('click', async () => {
      const btn = document.getElementById('seed-btn');
      btn.disabled = true;
      btn.textContent = 'Seeding…';
      try {
        const res = await fetch('/api/seed', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error ?? `HTTP ${res.status}`);
        btn.textContent = `✓ ${data.created} tasks added`;
        await fetchTasks();
        setTimeout(() => {
          btn.textContent = 'Seed demo data';
          btn.disabled = false;
        }, 2500);
      } catch (err) {
        document.getElementById('error-container').innerHTML =
          `<div class="error-banner">Seed failed: ${esc(err.message)}</div>`;
        btn.textContent = 'Seed demo data';
        btn.disabled = false;
      }
    });

    fetchTasks();
    setInterval(fetchTasks, 3000);
  </script>
</body>
</html>
